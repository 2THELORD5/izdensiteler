<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANVIL — Kling Test Scrub</title>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=satoshi@400,700&display=swap" rel="stylesheet" />
  <style>
    :root { --ember:#e08a3a; }
    * { box-sizing: border-box; }
    html { scrollbar-width: none; background:#050506; }
    body { margin:0; font-family:Satoshi,system-ui,sans-serif; color:#f4efe6; background:#050506; }
    .track { height: 420vh; }
    .pin { position:sticky; top:0; height:100svh; overflow:hidden; background:#000; }
    canvas, video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    video { opacity:0; pointer-events:none; }
    .ui { position:absolute; left:1.5rem; bottom:2.5rem; z-index:2; max-width:28rem; text-shadow:0 10px 30px #000; }
    .ui b { display:block; color:var(--ember); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; margin-bottom:.5rem; }
    .ui h1 { font-family:"Clash Display",sans-serif; font-size:clamp(2rem,6vw,3.8rem); margin:0 0 .5rem; letter-spacing:-.03em; }
    .ui p { margin:0; opacity:.7; }
    .note { position:fixed; top:1rem; right:1rem; z-index:5; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; opacity:.55; }
    .bar { position:fixed; top:0; left:0; height:2px; width:0; background:var(--ember); z-index:6; }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <div class="note">Kling test · credit top-up needed for full film</div>
  <div class="track" id="track">
    <div class="pin">
      <canvas id="c"></canvas>
      <video id="v" src="./public/film-kling-720.mp4" muted playsinline preload="auto"></video>
      <div class="ui">
        <b>Kling shot 01</b>
        <h1>Lift test</h1>
        <p>Scroll to scrub. Full explode chain needs more Kie credits.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const ctx = c.getContext('2d', { alpha:false });
    const track = document.getElementById('track');
    const bar = document.getElementById('bar');
    let dur = 0, ready = false, seeking = false, pending = null, last = -1;
    const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
    function resize(){ const d=Math.min(devicePixelRatio||1,2); const r=c.getBoundingClientRect(); c.width=r.width*d; c.height=r.height*d; }
    function paint(){ if(!ready||v.readyState<2) return; resize(); const cw=c.width,ch=c.height,vw=v.videoWidth,vh=v.videoHeight; const s=Math.max(cw/vw,ch/vh); ctx.fillStyle='#000'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(v,(cw-vw*s)/2,(ch-vh*s)/2,vw*s,vh*s); }
    function seek(t){ if(!ready) return; const n=clamp(t,0,Math.max(0,dur-0.04)); if(Math.abs(n-last)<0.012){paint();return;} if(seeking){pending=n;return;} seeking=true; last=n; try{v.currentTime=n;}catch{seeking=false;} setTimeout(()=>{seeking=false;paint(); if(pending!=null){const p=pending;pending=null;seek(p);}},80); }
    v.addEventListener('seeked',()=>{seeking=false;paint(); if(pending!=null){const p=pending;pending=null;seek(p);}});
    v.addEventListener('loadedmetadata',()=>{dur=v.duration||0; ready=dur>0; try{v.currentTime=0.001;}catch{}; paint();});
    v.load();
    const lenis=new Lenis({duration:1.1,smoothWheel:true});
    let tp=0,cp=0;
    function progress(){ const vh=innerHeight||1; return clamp(-track.getBoundingClientRect().top/Math.max(1,track.offsetHeight-vh)); }
    lenis.on('scroll',()=>{tp=progress();});
    function loop(t){ lenis.raf(t); cp+=(tp-cp)*0.18; seek(cp*dur); bar.style.width=(cp*100)+'%'; requestAnimationFrame(loop);} requestAnimationFrame(loop);
    addEventListener('resize',()=>{paint();});
  </script>
</body>
</html>
